  <text x="750" y="1443" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" fill="#536277" text-anchor="middle" dominant-baseline="central">Left / Right / Bottom / Top 是从对应墙面数的节点编号，不是物理层厚。</text>
