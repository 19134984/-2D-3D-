<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">一个 LBM 时间步的碰撞迁移流程</title>
  <desc id="desc">从时刻 t 的 populations 出发，先求宏观量和平衡态，再原地碰撞，然后沿离散速度迁移并处理边界，得到时刻 t 加一的 populations。</desc>
  <defs>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#314150"/></marker>
    <style>
      .box{fill:#eef5fb;stroke:#1261a0;stroke-width:2}.check{fill:#fff4d6;stroke:#9a6700;stroke-width:2}
      .arrow{stroke:#314150;stroke-width:3;marker-end:url(#flowArrow)}
      .label{font-family:"Microsoft YaHei",sans-serif;font-size:18px;fill:#17212b}.small{font-size:14px;fill:#46515c}
    </style>
  </defs>
  <rect width="1100" height="430" fill="#ffffff"/>
  <text class="label" x="550" y="34" text-anchor="middle">一个 LBM 时间步：同一批 population 先在速度空间重分配，再在物理空间搬运</text>
  <rect class="box" x="30" y="120" width="170" height="105" rx="8"/><text class="label" x="115" y="155" text-anchor="middle">时刻 t</text><text class="small" x="115" y="184" text-anchor="middle">各格点 hᵢ(x,t)</text>
  <rect class="box" x="245" y="95" width="190" height="155" rx="8"/><text class="label" x="340" y="132" text-anchor="middle">重构 + 平衡态</text><text class="small" x="340" y="165" text-anchor="middle">Σᵢhᵢ 及速度加权和</text><text class="small" x="340" y="192" text-anchor="middle">计算 hᵢᵉᑫ</text><text class="small" x="340" y="219" text-anchor="middle">仍在原格点</text>
  <rect class="check" x="480" y="95" width="180" height="155" rx="8"/><text class="label" x="570" y="132" text-anchor="middle">碰撞</text><text class="small" x="570" y="165" text-anchor="middle">hᵢ → hᵢ*</text><text class="small" x="570" y="192" text-anchor="middle">改变方向分配</text><text class="small" x="570" y="219" text-anchor="middle">检查守恒矩不变</text>
  <rect class="box" x="705" y="95" width="190" height="155" rx="8"/><text class="label" x="800" y="132" text-anchor="middle">迁移 + 边界</text><text class="small" x="800" y="165" text-anchor="middle">沿 cᵢ 搬到邻居</text><text class="small" x="800" y="192" text-anchor="middle">固体来源 → 边界闭合</text><text class="small" x="800" y="219" text-anchor="middle">改变空间位置</text>
  <rect class="box" x="940" y="120" width="130" height="105" rx="8"/><text class="label" x="1005" y="155" text-anchor="middle">时刻 t+1</text><text class="small" x="1005" y="184" text-anchor="middle">新的 hᵢ</text>
  <line class="arrow" x1="200" y1="172" x2="235" y2="172"/><line class="arrow" x1="435" y1="172" x2="470" y2="172"/>
  <line class="arrow" x1="660" y1="172" x2="695" y2="172"/><line class="arrow" x1="895" y1="172" x2="930" y2="172"/>
  <path class="arrow" fill="none" d="M1005,235 C1005,355 115,355 115,235"/>
  <text class="small" x="550" y="385" text-anchor="middle">循环到下一步：先由新 populations 再次重构宏观量</text>
  <text class="small" x="550" y="410" text-anchor="middle">碰撞 ≠ 迁移；边界规则负责补齐从固体方向来的未知入射 population</text>
</svg>
