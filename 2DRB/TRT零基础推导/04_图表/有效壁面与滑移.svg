<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">名义 halfway 壁面、有效零速度点与表观滑移</title>
  <desc id="desc">一条对称抛物线在更外侧的两个有效壁面处速度为零，而在更内侧的两条名义 halfway 壁面处仍有非零速度 u_slip。图示选择 D_eff 大于 D_1/2，只用于说明有效宽度偏移与表观滑移的几何关系。</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#4f6070"/></marker>
    <style>
      .title{font:600 24px 'Microsoft YaHei',sans-serif;fill:#17324d}
      .head{font:600 18px 'Microsoft YaHei',sans-serif;fill:#17324d}
      .body{font:16px 'Microsoft YaHei',sans-serif;fill:#263746}
      .math{font:17px Consolas,'Microsoft YaHei',sans-serif;fill:#263746}
      .small{font:14px 'Microsoft YaHei',sans-serif;fill:#4f6070}
      .axis{stroke:#465867;stroke-width:2}
      .curve{stroke:#1769aa;stroke-width:5;fill:none}
      .effective{stroke:#23865b;stroke-width:5}
      .nominal{stroke:#b66300;stroke-width:3;stroke-dasharray:8 6}
      .slip{fill:#c43f38;stroke:#8e251f;stroke-width:2}
      .dimE{stroke:#23865b;stroke-width:2;fill:none;marker-start:url(#arr);marker-end:url(#arr)}
      .dimN{stroke:#b66300;stroke-width:2;fill:none;marker-start:url(#arr);marker-end:url(#arr)}
      .note{fill:#f4f7fa;stroke:#8c9aa7;stroke-width:1.5}
    </style>
  </defs>

  <text class="title" x="600" y="38" text-anchor="middle">表观滑移 = 名义墙面与抛物线零点不重合</text>
  <text class="small" x="600" y="65" text-anchor="middle">示意取 D_eff &gt; D_1/2；它不是所有参数下都必然向外偏移</text>

  <line class="axis" x1="150" y1="390" x2="1050" y2="390"/>
  <line class="axis" x1="600" y1="410" x2="600" y2="80"/>
  <text class="math" x="1060" y="396">x</text>
  <text class="math" x="612" y="92">u(x)</text>
  <text class="math" x="612" y="120">u_0</text>

  <path class="curve" d="M250 390 Q600 -170 950 390"/>
  <text class="head" x="795" y="150">数值抛物线</text>
  <text class="math" x="795" y="178">u = u_0(1 − 4x²/D_eff²)</text>

  <line class="effective" x1="250" y1="120" x2="250" y2="415"/>
  <line class="effective" x1="950" y1="120" x2="950" y2="415"/>
  <text class="small" x="250" y="108" text-anchor="middle">有效零速度墙</text>
  <text class="small" x="950" y="108" text-anchor="middle">有效零速度墙</text>

  <line class="nominal" x1="350" y1="175" x2="350" y2="415"/>
  <line class="nominal" x1="850" y1="175" x2="850" y2="415"/>
  <text class="small" x="350" y="450" text-anchor="middle">名义 halfway 墙</text>
  <text class="small" x="850" y="450" text-anchor="middle">名义 halfway 墙</text>

  <circle class="slip" cx="350" cy="247" r="7"/>
  <circle class="slip" cx="850" cy="247" r="7"/>
  <text class="math" x="365" y="235">u_slip ≠ 0</text>
  <text class="math" x="735" y="235">u_slip ≠ 0</text>
  <line class="nominal" x1="350" y1="390" x2="350" y2="247"/>
  <line class="nominal" x1="850" y1="390" x2="850" y2="247"/>

  <line class="dimE" x1="260" y1="485" x2="940" y2="485"/>
  <text class="math" x="600" y="512" text-anchor="middle">D_eff：由零速度点定义</text>
  <line class="dimN" x1="360" y1="530" x2="840" y2="530"/>
  <text class="math" x="600" y="552" text-anchor="middle">D_1/2：由 cut-link 中点规定</text>

  <rect class="note" x="45" y="95" width="175" height="120" rx="9"/>
  <text class="body" x="132" y="128" text-anchor="middle">magic 条件要求</text>
  <text class="math" x="132" y="162" text-anchor="middle">D_eff = D_1/2</text>
  <text class="small" x="132" y="194" text-anchor="middle">此时名义墙速度为 0</text>
</svg>
