<svg xmlns="http://www.w3.org/2000/svg" width="780" height="680" viewBox="0 0 780 680" role="img" aria-labelledby="title desc">
  <title id="title">D2Q9 离散速度、编号、权重和反向方向</title>
  <desc id="desc">中心零，东一、北二、西三、南四，东北五、西北六、西南七、东南八。</desc>
  <defs>
    <marker id="arrow9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1261a0"/></marker>
    <marker id="arrowDiag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8a4f9f"/></marker>
    <style>
      .grid{stroke:#c7cdd3;stroke-width:1}.axis{stroke:#1261a0;stroke-width:4;marker-end:url(#arrow9)}
      .diag{stroke:#8a4f9f;stroke-width:4;marker-end:url(#arrowDiag)}
      .node{fill:#ffffff;stroke:#1d2733;stroke-width:2}.origin{fill:#ffe6a7;stroke:#9a6700;stroke-width:3}
      .label{font-family:"Microsoft YaHei",sans-serif;font-size:17px;fill:#17212b}.small{font-size:14px;fill:#46515c}
    </style>
  </defs>
  <rect width="780" height="680" fill="#ffffff"/>
  <text class="label" x="390" y="34" text-anchor="middle">D2Q9：D2Q5 的五个方向 + 四个对角方向</text>
  <g>
    <line class="grid" x1="150" y1="335" x2="630" y2="335"/><line class="grid" x1="390" y1="95" x2="390" y2="575"/>
    <line class="grid" x1="220" y1="165" x2="560" y2="505"/><line class="grid" x1="560" y1="165" x2="220" y2="505"/>
    <circle class="origin" cx="390" cy="335" r="22"/>
    <line class="axis" x1="420" y1="335" x2="575" y2="335"/><line class="axis" x1="390" y1="305" x2="390" y2="150"/>
    <line class="axis" x1="360" y1="335" x2="205" y2="335"/><line class="axis" x1="390" y1="365" x2="390" y2="520"/>
    <line class="diag" x1="412" y1="313" x2="535" y2="190"/><line class="diag" x1="368" y1="313" x2="245" y2="190"/>
    <line class="diag" x1="368" y1="357" x2="245" y2="480"/><line class="diag" x1="412" y1="357" x2="535" y2="480"/>
    <circle class="node" cx="600" cy="335" r="12"/><circle class="node" cx="390" cy="125" r="12"/>
    <circle class="node" cx="180" cy="335" r="12"/><circle class="node" cx="390" cy="545" r="12"/>
    <circle class="node" cx="560" cy="165" r="12"/><circle class="node" cx="220" cy="165" r="12"/>
    <circle class="node" cx="220" cy="505" r="12"/><circle class="node" cx="560" cy="505" r="12"/>
  </g>
  <text class="label" x="617" y="328">1 东</text><text class="small" x="617" y="349">(1,0), w=1/9</text>
  <text class="label" x="390" y="92" text-anchor="middle">2 北 (0,1), w=1/9</text>
  <text class="label" x="163" y="328" text-anchor="end">3 西</text><text class="small" x="163" y="349" text-anchor="end">(-1,0), w=1/9</text>
  <text class="label" x="390" y="586" text-anchor="middle">4 南 (0,-1), w=1/9</text>
  <text class="label" x="578" y="150">5 东北</text><text class="small" x="578" y="171">(1,1), w=1/36</text>
  <text class="label" x="202" y="150" text-anchor="end">6 西北</text><text class="small" x="202" y="171" text-anchor="end">(-1,1), w=1/36</text>
  <text class="label" x="202" y="520" text-anchor="end">7 西南</text><text class="small" x="202" y="541" text-anchor="end">(-1,-1), w=1/36</text>
  <text class="label" x="578" y="520">8 东南</text><text class="small" x="578" y="541">(1,-1), w=1/36</text>
  <text class="label" x="390" y="328" text-anchor="middle">0</text><text class="small" x="390" y="350" text-anchor="middle">w₀=4/9</text>
  <text class="small" x="390" y="626" text-anchor="middle">反向对：1↔3，2↔4，5↔7，6↔8，0↔0</text>
  <text class="small" x="390" y="652" text-anchor="middle">蓝色为轴向，紫色为对角；颜色不是新的物理变量</text>
</svg>
