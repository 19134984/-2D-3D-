<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Halfway cut link 上的流体节点、墙面、固体节点和反弹 population</title>
  <desc id="desc">左侧是流体区域和最后一个流体节点 x_b，右侧是外部固体节点。几何墙面位于两节点连线的中点 delta_q 等于二分之一。蓝色箭头表示碰撞后 population f_q 星号朝墙面出射，橙色箭头表示边界构造的反向 population f_bar q 返回流体节点。</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#1769aa"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#b66300"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#4f6070"/></marker>
    <style>
      .title{font:600 24px 'Microsoft YaHei',sans-serif;fill:#17324d}
      .head{font:600 18px 'Microsoft YaHei',sans-serif;fill:#17324d}
      .body{font:16px 'Microsoft YaHei',sans-serif;fill:#263746}
      .math{font:17px Consolas,'Microsoft YaHei',sans-serif;fill:#263746}
      .small{font:14px 'Microsoft YaHei',sans-serif;fill:#4f6070}
      .fluid{fill:#edf6ff}
      .solid{fill:#fff1ef}
      .nodeF{fill:#1769aa;stroke:#0d4f83;stroke-width:3}
      .nodeS{fill:#c75b4d;stroke:#8f3328;stroke-width:3}
      .link{stroke:#566675;stroke-width:5}
      .wall{stroke:#202d38;stroke-width:7}
      .dash{stroke:#6f7f8c;stroke-width:2;stroke-dasharray:7 6}
      .out{stroke:#1769aa;stroke-width:4;fill:none;marker-end:url(#arrowBlue)}
      .in{stroke:#b66300;stroke-width:4;fill:none;marker-end:url(#arrowOrange)}
      .dim{stroke:#4f6070;stroke-width:1.8;fill:none;marker-start:url(#arrowGray);marker-end:url(#arrowGray)}
    </style>
  </defs>

  <rect class="fluid" x="30" y="65" width="570" height="355" rx="12"/>
  <rect class="solid" x="600" y="65" width="570" height="355" rx="12"/>
  <text class="title" x="600" y="38" text-anchor="middle">一条被墙面截断的 link：已知出射，未知入射</text>
  <text class="head" x="150" y="105" text-anchor="middle">流体区域</text>
  <text class="head" x="1050" y="105" text-anchor="middle">外部 / 固体区域</text>

  <line class="link" x1="270" y1="250" x2="930" y2="250"/>
  <circle class="nodeF" cx="270" cy="250" r="20"/>
  <circle class="nodeS" cx="930" cy="250" r="20"/>
  <line class="wall" x1="600" y1="155" x2="600" y2="345"/>
  <line class="dash" x1="600" y1="120" x2="600" y2="390"/>

  <text class="math" x="225" y="238" text-anchor="end">x_b</text>
  <text class="small" x="225" y="265" text-anchor="end">最后一个流体节点</text>
  <text class="math" x="930" y="295" text-anchor="middle">x_b + c_q</text>
  <text class="small" x="930" y="320" text-anchor="middle">相邻固体节点</text>
  <text class="head" x="600" y="135" text-anchor="middle">几何墙面</text>
  <text class="math" x="600" y="375" text-anchor="middle">x_w = x_b + δ_q c_q</text>

  <path class="out" d="M305 210 L575 210"/>
  <text class="math" x="440" y="190" text-anchor="middle">f_q*，沿 c_q 出射</text>
  <path class="in" d="M575 285 L305 285"/>
  <text class="math" x="440" y="315" text-anchor="middle">f_bar(q)，沿 c_bar(q) 返回</text>

  <line class="dim" x1="280" y1="405" x2="590" y2="405"/>
  <text class="math" x="435" y="440" text-anchor="middle">δ_q = 1/2（halfway）</text>
  <line class="dim" x1="610" y1="405" x2="920" y2="405"/>
  <text class="small" x="765" y="440" text-anchor="middle">另一半 link</text>

  <text class="small" x="600" y="478" text-anchor="middle">BB 在流体侧用已知 f_q* 构造固体侧无法提供的入射 population；墙面不是固体节点本身</text>
</svg>
