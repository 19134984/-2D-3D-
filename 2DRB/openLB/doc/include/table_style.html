<style>
    .table-wrap { overflow-x: auto; }
    table.matrix {
        border-collapse: collapse;
        width: max-content; /* keeps all columns visible; scroll horizontally */
        min-width: 1200px;
        table-layout: fixed;
        font-size: 12px;
    }
    table.matrix tr.thick-top > td,
    table.matrix tr.thick-top > th {
    border-top: 3px solid #000 !important;
    }
    table.matrix tr.thick-bottom > td,
    table.matrix tr.thick-bottom > th {
    border-bottom: 3px solid #000 !important;
    }

    table.matrix th, table.matrix td {
        border: 1px solid #000;
        padding: 4px 6px;
        vertical-align: middle;
        text-align: center;
        white-space: nowrap;
    }
    table.matrix th {
        font-weight: 600;
    }
    table.matrix .left, .left { text-align: left; white-space: normal; }
    .folder { font-weight: 600; white-space: normal; }

    .bg-darkgray {
        background-color: #f0f0f0 !important;
        color: #000 !important;
    }

    .bg-lightgray {
        background-color: #fafafa !important;
        color: #000 !important;
    }

    .bg-royalblue { background-color: #4169e1 !important; color: #fff !important; }
    .bg-royalbluedark { background-color: #191970 !important; color: #fff !important; }
    .bg-green { background-color: #00a000 !important; color: #fff !important; }
    /* Features example_table.py has no data for yet -- "?" in _features.csv. */
    .bg-unknown { background-color: #ffe9a8 !important; color: #8a6d00 !important; }

    /* The example names link to their pages. */
    table.matrix td a { color: inherit; text-decoration: none; }
    table.matrix td a:hover { text-decoration: underline; }
    /* Directories between the category and a nested example. */
    table.matrix .ex-path { color: #777; }

    table.legend-table { margin-bottom: 0.75em; border-collapse: separate; border-spacing: 4px 0; }
    table.legend-table td { padding: 2px 6px; border: 0; }
    table.legend-table td[class^="bg-"] { width: 1.5em; }

    /* mimic “footnotesize” a bit */
    .footnotesize { font-size: 11px; }
</style>
